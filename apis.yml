description: Moneta Health provides an at‑home memory rehabilitation program delivered via phone and video. It offers personalized cognitive therapy
  to improve memory, focus, and daily functioning for patients with mild cognitive impairment. Backed by True Ventures, the service is covered
  by insurance in several U.S. states and aims to make brain health care accessible remotely.

